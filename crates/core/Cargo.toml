[package]
name = "unlost-core"
description = "Recovery engine for Unlost: read-only device access, destination guard, Recycle Bin, shadow copies, NTFS undelete and the elevated broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
unlost-formats = { path = "../formats" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
parking_lot = "=0.12.5"
sha2 = "=0.11.1"
hmac = "=0.13.0"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "cache"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
winreg = "=0.56.0"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Vhd",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
unlost-formats = { path = "../formats", features = ["test-util"] }
tempfile = "=3.27.0"
sha2 = "=0.11.1"
